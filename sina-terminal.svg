<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 330" width="100%" height="100%">
  <defs>
    <!-- Background card gradient -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13.5px;
    }
    
    /* Pure opacity keyframes - compatible with GitHub sanitizer */
    @keyframes lineFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Staggered Line Reveals */
    .l-1 { animation: lineFade 0.4s ease forwards 0.2s; opacity: 0; }
    .l-2 { animation: lineFade 0.4s ease forwards 0.8s; opacity: 0; }
    .l-3 { animation: lineFade 0.4s ease forwards 1.4s; opacity: 0; }
    .l-4 { animation: lineFade 0.4s ease forwards 2.0s; opacity: 0; }
    .l-5 { animation: lineFade 0.4s ease forwards 2.6s; opacity: 0; }
    .l-6 { animation: lineFade 0.4s ease forwards 3.2s; opacity: 0; }
    .l-7 { animation: lineFade 0.4s ease forwards 3.8s; opacity: 0; }

    /* Blinking Cursor */
    .cursor {
      animation: blink 0.8s infinite 4.2s;
      opacity: 0;
    }
  </style>

  <!-- Outer Window Container -->
  <rect x="1" y="1" width="648" height="328" rx="12" fill="url(#terminalBg)" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 637 1 A 12 12 0 0 1 649 13 L 649 38 L 1 38 Z" fill="#181614" />
  <line x1="1" y1="38" x2="649" y2="38" stroke="#292524" stroke-width="1" />

  <!-- Mac Window Action Buttons -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="20" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="20" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="325" y="24" fill="#78716c" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">
    sina@vancouver: ~
  </text>

  <!-- Terminal Content Body with fixed Y positions -->
  <g class="terminal-text">
    
    <!-- Line 1: whoami -->
    <g class="l-1">
      <text x="25" y="80" fill="#ef4444" font-weight="bold">➜</text>
      <text x="43" y="80" fill="#38bdf8" font-weight="bold">~</text>
      <text x="60" y="80" fill="#f5f5f4">whoami --details</text>
    </g>

    <!-- Line 2: Name -->
    <g class="l-2">
      <text x="25" y="112" fill="#a8a29e">Name:</text>
      <text x="145" y="112" fill="#f87171" font-weight="bold">Sina Rahmannejad</text>
    </g>

    <!-- Line 3: Role -->
    <g class="l-3">
      <text x="25" y="142" fill="#a8a29e">Role:</text>
      <text x="145" y="142" fill="#facc15">Full Stack Web Developer</text>
    </g>

    <!-- Line 4: Location -->
    <g class="l-4">
      <text x="25" y="172" fill="#a8a29e">Location:</text>
      <text x="145" y="172" fill="#34d399">Vancouver, BC 🇨🇦</text>
    </g>

    <!-- Line 5: Core Stack (AI added) -->
    <g class="l-5">
      <text x="25" y="202" fill="#a8a29e">Core Stack:</text>
      <text x="145" y="202" fill="#60a5fa">AI, Laravel, TypeScript, MySQL</text>
    </g>

    <!-- Line 6: Status -->
    <g class="l-6">
      <text x="25" y="232" fill="#a8a29e">Status:</text>
      <text x="145" y="232" fill="#e879f9">Open to collaborations &amp; opportunities</text>
    </g>

    <!-- Line 7: Next Prompt + Cursor -->
    <g class="l-7">
      <text x="25" y="272" fill="#ef4444" font-weight="bold">➜</text>
      <text x="43" y="272" fill="#38bdf8" font-weight="bold">~</text>
      <text x="60" y="272" fill="#f5f5f4">curl -s https://sinarahmannejad.com</text>
      <rect class="cursor" x="350" y="259" width="8" height="15" fill="#ef4444" />
    </g>

  </g>
</svg>
